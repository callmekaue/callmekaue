name: Atualizar koi de commits

on:
  schedule:
    - cron: "17 3 * * *"   # todo dia, 00:17 em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/peixe-commits.yml"

permissions:
  contents: write

jobs:
  peixe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar peixe-commits.svg
        env:
          # Opcional: crie o segredo PEIXE_TOKEN (PAT) para contar também commits privados
          GITHUB_TOKEN: ${{ secrets.PEIXE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          INCLUIR_PRIVADOS: ${{ secrets.PEIXE_TOKEN && '1' || '0' }}
        run: python3 scripts/peixe_commits.py

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peixe-commits.svg
          git diff --cached --quiet || (git commit -m "🐟 koi de commits atualizado" && git push)
